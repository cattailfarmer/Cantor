[package]
name = "cantor_sop_inspect_mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "cantor-sop-inspect-mcp"
path = "src/main.rs"

[dependencies]
cantor_sop_inspect_wire = { path = "../cantor_sop_inspect_wire" }
cantor_sop_semantics = { path = "../cantor_sop_semantics" }
futures-util = "=0.3.33"
rmcp = { workspace = true, features = ["server", "transport-async-rw"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "=0.7.19", features = ["codec", "rt"] }

[dev-dependencies]
rmcp = { workspace = true, features = ["client", "server", "transport-async-rw"] }
tokio = { workspace = true, features = ["macros", "process", "io-util", "rt-multi-thread", "time"] }

[lints]
workspace = true
