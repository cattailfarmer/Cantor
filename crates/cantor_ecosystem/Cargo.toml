[package]
name = "cantor_ecosystem"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
cantor_core = { path = "../cantor_core" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
ed25519-dalek.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", default-features = false, features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading"] }

[lints.rust]
# The governed Windows containment module carries its own narrow allow around
# audited FFI. Every other unsafe occurrence in this crate remains an error.
unsafe_code = "deny"
