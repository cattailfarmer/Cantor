[package]
name = "cantor_mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "cantor-mcp"
path = "src/main.rs"

[dependencies]
cantor_core = { path = "../cantor_core" }
cantor_service = { path = "../cantor_service" }
rmcp = { workspace = true, features = ["server", "transport-io"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std", "macros", "rt"] }

[dev-dependencies]
ed25519-dalek.workspace = true
rmcp = { workspace = true, features = ["client", "server", "transport-child-process", "transport-io"] }
tokio = { workspace = true, features = ["io-std", "macros", "process", "rt", "time"] }

[lints]
workspace = true
