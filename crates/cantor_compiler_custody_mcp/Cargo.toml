[package]
name = "cantor_compiler_custody_mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "cantor-compiler-custody-mcp"
path = "src/main.rs"

[dependencies]
cantor_core = { path = "../cantor_core" }
rmcp = { workspace = true, features = ["server", "transport-io"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std", "macros", "rt", "sync"] }

[dev-dependencies]
cantor_lifecycle_tool_loop = { path = "../cantor_lifecycle_tool_loop" }
ed25519-dalek.workspace = true
rmcp = { workspace = true, features = ["client", "server", "transport-child-process", "transport-io"] }
tokio = { workspace = true, features = ["io-std", "macros", "process", "rt", "sync"] }

[lints]
workspace = true
