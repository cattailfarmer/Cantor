[package]
name = "cantor_identity_accounting_mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "cantor-identity-accounting-mcp"
path = "src/main.rs"

[[bin]]
name = "cantor-identity-accounting-bootstrap"
path = "src/bin/cantor-identity-accounting-bootstrap.rs"

[dependencies]
cantor_core = { path = "../cantor_core", features = ["json-schema"] }
rmcp = { workspace = true, features = ["server", "transport-io"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std", "macros", "rt", "sync"] }

[dev-dependencies]
rmcp = { workspace = true, features = ["client", "server", "transport-child-process", "transport-io"] }
tokio = { workspace = true, features = ["io-std", "macros", "process", "rt", "sync"] }

[lints]
workspace = true
