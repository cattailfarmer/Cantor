[package]
name = "cantor_compact_coordination_mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "cantor-compact-coordination-mcp"
path = "src/main.rs"

[dependencies]
cantor_core = { path = "../cantor_core", features = ["json-schema"] }
cantor_procedure_tool = { path = "../cantor_procedure_tool", features = ["json-schema"] }
rmcp = { workspace = true, features = ["server", "transport-io"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std", "macros", "rt", "sync"] }

[dev-dependencies]
rmcp = { workspace = true, features = ["client", "server", "transport-child-process", "transport-io"] }
tokio = { workspace = true, features = ["io-std", "macros", "process", "rt"] }

[lints]
workspace = true

