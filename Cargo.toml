[workspace]
members = [
    "crates/cantor_core",
    "crates/cantor_procedure_tool",
    "crates/cantor_cli",
    "crates/cantor_mcp",
    "crates/cantor_attention_mcp",
    "crates/cantor_service",
    "crates/cantor_ecosystem",
    "crates/cantor_windows_preflight",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"

[workspace.dependencies]
ed25519-dalek = "3.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
schemars = "=1.2.2"
rmcp = { version = "3.0.1", default-features = false }
tokio = { version = "1.53.1", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
overflow-checks = true
