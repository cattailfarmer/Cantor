[package]
name = "cantor-llama-tool-reflection"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lints.rust]
unsafe_code = "forbid"

[dependencies]
cantor_core = { path = "../../crates/cantor_core" }
cantor_lifecycle_tool_loop = { path = "../../crates/cantor_lifecycle_tool_loop" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1.53.1", default-features = false, features = ["macros", "rt-multi-thread", "time"] }
