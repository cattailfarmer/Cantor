[package]
name = "cantor-persistence-benchmark"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lints.rust]
unsafe_code = "forbid"

[profile.release]
overflow-checks = true

[dependencies]
cantor_core = { path = "../../crates/cantor_core" }
ed25519-dalek = "3.0.0"
redb = "4.1.0"
rusqlite = { version = "0.40.1", default-features = false, features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
